start: start_cell
is: client-server
requires: 
    client: cell1
    server: cell2
cells:
    start_cell:
        stacked_cell:
            - cell2
        repeat: 3
        output: true
    cell1:
        targets:
            - executer@node2.portalapitesting.powdersandbox.emulab.net
        commands:
            - iperf3 -s
        synchronous: false

    cell2:
        targets:
            - executer@node1.portalapitesting.powdersandbox.emulab.net
        commands:
            - iperf3 -c 192.168.1.2 -t -1
        output: true
        setup: cell1
        teardown: cell3

    cell3:
        targets:
            - executer@node2.portalapitesting.powdersandbox.emulab.net
        commands:
            - pkill iperf3


###### For Client-Server Model ######

# So the evaluation order will be
# server_setup -> client_setup -> server_command -> client_command -> client_teardown -> server_teardown
cells:
    client:
        targets:
            - executer@node1.portalapitesting.powdersandbox.emulab.net
        commands:
            - iperf3 -c 192.168.1.2 -t -1
        output: true
    
    server:
        setup: server_setup
        teardown: server_teardown

    server_setup:
        targets:
            - executer@node2.portalapitesting.powdersandbox.emulab.net
        commands:
            - iperf3 -s
        synchronous: false
    
    server_teardown:
        targets:
            - executer@node2.portalapitesting.powdersandbox.emulab.net
        commands:
            - pkill iperf3
